version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: jira-clone-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: jira_clone
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jira-network

  redis:
    image: redis:7.2-alpine
    container_name: jira-clone-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jira-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jira-clone-backend-node
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: mongodb://mongodb:27017/jira_clone
      DATABASE_NAME: jira_clone
      JWT_SECRET: Jira_Clone_my_Project_2026_super_secure_key_32bytes
      JWT_REFRESH_SECRET: Jira_Clone_my_Project_2026_refresh
      REDIS_URL: redis://redis:6379
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - jira-network

  backend_fastapi:
    build:
      context: ./backend_fastapi
      dockerfile: Dockerfile
    container_name: jira-clone-backend-fastapi
    restart: always
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      NODE_ENV: production
      DATABASE_URL: mongodb://mongodb:27017/jira_clone
      DATABASE_NAME: jira_clone
      JWT_SECRET: Jira_Clone_my_Project_2026_super_secure_key_32bytes
      JWT_REFRESH_SECRET: Jira_Clone_my_Project_2026_refresh
      REDIS_URL: redis://redis:6379
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - jira-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jira-clone-frontend
    restart: always
    ports:
      - "80:80"
    environment:
      VITE_API_URL: http://localhost:5000
      VITE_FASTAPI_URL: http://localhost:8000
      VITE_WS_URL: ws://localhost:8000/ws
    depends_on:
      - backend
      - backend_fastapi
    networks:
      - jira-network

volumes:
  mongodata:
    driver: local
  redisdata:
    driver: local

networks:
  jira-network:
    driver: bridge
