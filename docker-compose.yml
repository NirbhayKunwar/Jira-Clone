version: '3.8'

services:
  db:
    image: mongo:latest
    container_name: jira-clone-db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jira-clone-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: mongodb://db:27017/jira_clone?retryWrites=true&w=majority
      JWT_SECRET: supersecretproductionkey123!
      PORT: 5000
      NODE_ENV: production
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jira-clone-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongodata:
