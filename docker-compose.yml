version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: jira-clone-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-change_me_in_prod}
      MONGO_INITDB_DATABASE: ${DATABASE_NAME:-jira_clone}
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "-u", "${MONGO_INITDB_ROOT_USERNAME:-admin}", "-p", "${MONGO_INITDB_ROOT_PASSWORD:-change_me_in_prod}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jira-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jira-clone-backend-node
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-mongodb://${MONGO_INITDB_ROOT_USERNAME:-admin}:${MONGO_INITDB_ROOT_PASSWORD:-change_me_in_prod}@mongodb:27017/${DATABASE_NAME:-jira_clone}?authSource=admin}
      DATABASE_NAME: ${DATABASE_NAME:-jira_clone}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - jira-network

  backend_fastapi:
    build:
      context: ./backend_fastapi
      dockerfile: Dockerfile
    container_name: jira-clone-backend-fastapi
    restart: always
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-mongodb://${MONGO_INITDB_ROOT_USERNAME:-admin}:${MONGO_INITDB_ROOT_PASSWORD:-change_me_in_prod}@mongodb:27017/${DATABASE_NAME:-jira_clone}?authSource=admin}
      DATABASE_NAME: ${DATABASE_NAME:-jira_clone}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - jira-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jira-clone-frontend
    restart: always
    ports:
      - "80:80"
    environment:
      VITE_API_URL: http://localhost:5000
      VITE_FASTAPI_URL: http://localhost:8000
      VITE_WS_URL: ws://localhost:8000/ws
    depends_on:
      - backend
      - backend_fastapi
    networks:
      - jira-network

volumes:
  mongodata:
    driver: local

networks:
  jira-network:
    driver: bridge
