<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22><path d=%22M11.5 2C11.5 2 11.5 5.5 8 9C4.5 12.5 1 12.5 1 12.5L7.5 19L11.5 23L15 19.5L11.5 2Z%22 fill=%22%230052cc%22 /><path d=%22M23 12.5C23 12.5 19.5 12.5 16 9C12.5 5.5 12.5 2 12.5 2L16.5 6L20.5 10L23 12.5Z%22 fill=%22%232684ff%22 /><path d=%22M12.5 22C12.5 22 16 22 19.5 18.5C23 15 23 11.5 23 11.5L19 15L15 19L12.5 22Z%22 fill=%22%230052cc%22 /></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Manage projects, log work, view Roadmaps, and track sprint goals in this high-fidelity interactive Jira landing page clone built with React and Tailwind CSS v4." />
    <title>Jira Clone - Track Sprints, Manage Roadmaps &amp; Build Better</title>

    <!--
      Performance: DNS pre-resolution + TCP pre-connection to the backend API.
      Eliminates the ~100-300 ms DNS + TLS handshake cost on first API call.
      The href is left empty here and is filled by the inline script below so
      the value can come from the runtime environment (VITE_API_URL) without
      hard-coding a domain in the static HTML.
    -->
    <link rel="preconnect" id="api-preconnect" href="" crossorigin />
    <link rel="dns-prefetch" id="api-dns-prefetch" href="" />

    <!--
      Performance: Preconnect to Google Fonts CDN for faster font loading.
      This is only effective if the app loads any Google Fonts stylesheet.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <meta name="theme-color" id="meta-theme-color" content="#f5f7fb" />
    <meta name="color-scheme" content="light dark" />

    <script>
      // Inline (blocking) script intentionally — runs before any React code.
      // Sets the preconnect href to the correct backend origin at runtime
      // so static HTML doesn't need to know the deployment URL at build time.
      (function () {
        var apiUrl =
          // Vite replaces import.meta.env vars only inside JS modules, not HTML.
          // We fall back to the current origin (same-host deployments on Vercel).
          window.__VITE_API_URL__ || window.location.origin;

        var pc = document.getElementById('api-preconnect');
        var dns = document.getElementById('api-dns-prefetch');
        if (pc) pc.href = apiUrl;
        if (dns) dns.href = apiUrl;

        // Apply saved theme before React boots to eliminate flash of un-themed content
        try {
          var theme = localStorage.getItem('theme') || 'atlassian';
          var mode = localStorage.getItem('mode') || 'system';
          var resolvedMode = mode;
          if (mode === 'system') {
            resolvedMode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          var root = document.documentElement;
          root.setAttribute('data-theme', theme + '-' + resolvedMode);
          if (resolvedMode === 'dark') {
            root.classList.add('dark');
          } else {
            root.classList.remove('dark');
          }

          var themeColors = {
            'atlassian-light': '#f5f7fb',
            'atlassian-dark': '#070c19',
            'emerald-light': '#f2f8f5',
            'emerald-dark': '#04100c',
            'cyberpunk-light': '#faf4f8',
            'cyberpunk-dark': '#0c0216',
            'sunset-light': '#fdfaf2',
            'sunset-dark': '#100802'
          };
          var metaTheme = document.getElementById('meta-theme-color');
          if (metaTheme) {
            metaTheme.content = themeColors[theme + '-' + resolvedMode] || '#f5f7fb';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
